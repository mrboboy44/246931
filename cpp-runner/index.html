<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Putra C++ Runner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#e8edf2;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,select,textarea,input{font:inherit}.app{max-width:1100px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand h1{font-size:20px;margin:0}.brand p{margin:4px 0 0;color:#8995a3;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}button,select{border:1px solid #293340;background:#151b23;color:#e8edf2;border-radius:10px;padding:10px 13px;cursor:pointer}button.primary{background:#2f81f7;border-color:#2f81f7;font-weight:700}button:disabled{opacity:.55;cursor:not-allowed}.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr);gap:12px}.card{border:1px solid #222c37;background:#10161d;border-radius:14px;overflow:hidden}.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #222c37;background:#131a22}.bar strong{font-size:13px}.editor{width:100%;min-height:430px;resize:vertical;border:0;outline:0;padding:16px;background:#0b1016;color:#dce7f3;font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:4}.side{display:flex;flex-direction:column;gap:12px}.field{padding:12px}.field label{display:block;color:#98a5b3;font-size:12px;margin-bottom:7px}.field textarea{width:100%;min-height:110px;resize:vertical;background:#0b1016;color:#dce7f3;border:1px solid #27313c;border-radius:10px;padding:10px;outline:0;font:13px/1.5 ui-monospace,monospace}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.out{min-height:260px;white-space:pre-wrap;overflow:auto;padding:14px;font:13px/1.5 ui-monospace,monospace;color:#cbd5e1;background:#080c11}.status{font-size:12px;color:#8995a3}.ok{color:#62d992}.err{color:#ff7b72}.hint{padding:12px;color:#8995a3;font-size:11px;line-height:1.5;border-top:1px solid #222c37}@media(max-width:760px){.grid{grid-template-columns:1fr}.editor{min-height:360px}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><h1>Putra C++ Runner</h1><p>Tulis → Run → lihat output. Tanpa terminal.</p></div><div class="actions"><button id="sample">Contoh</button><button id="clear">Bersihkan</button><button id="run" class="primary">▶ Run C++</button></div></header>
<div class="grid">
<section class="card"><div class="bar"><strong>main.cpp</strong><span id="status" class="status">Siap</span></div><textarea id="code" class="editor" spellcheck="false">#include &lt;iostream&gt;
using namespace std;

int main() {
    string nama;
    cin &gt;&gt; nama;
    cout &lt;&lt; "Halo, " &lt;&lt; nama &lt;&lt; "!\n";
    return 0;
}</textarea></section>
<aside class="side">
<section class="card"><div class="bar"><strong>Pengaturan</strong></div><div class="field"><label>Compiler</label><select id="compiler"><option>Memuat compiler...</option></select></div><div class="field"><label>Compiler flags</label><input id="flags" value="-std=c++20 -O2" style="width:100%;background:#0b1016;color:#dce7f3;border:1px solid #27313c;border-radius:10px;padding:10px;outline:0"></div><div class="field"><label>stdin / input program</label><textarea id="stdin" placeholder="Contoh: Putra"></textarea></div></section>
<section class="card"><div class="bar"><strong>Output</strong><span id="time" class="status"></span></div><div id="output" class="out">Output akan muncul di sini.</div><div class="hint">Eksekusi dilakukan di sandbox Compiler Explorer, bukan di HP kamu. Jangan masukkan password, API key, atau data rahasia ke kode/input.</div></section>
</aside></div></div>
<script>
const $=id=>document.getElementById(id); const code=$('code'); const output=$('output'); const status=$('status'); const compiler=$('compiler');
function setStatus(t,c=''){status.textContent=t;status.className='status '+c}
async function loadCompilers(){try{const r=await fetch('https://godbolt.org/api/compilers/c++');if(!r.ok)throw Error('HTTP '+r.status);const list=await r.json();const usable=list.filter(x=>x.id&&/gcc|clang/i.test((x.name||'')+' '+x.id));const picks=(usable.length?usable:list).slice(0,30);compiler.innerHTML='';picks.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name||x.id;compiler.appendChild(o)});const gcc=picks.find(x=>/gcc/i.test(x.name||''));if(gcc)compiler.value=gcc.id;setStatus('Siap','ok')}catch(e){compiler.innerHTML='<option value="g132">GCC (fallback)</option>';setStatus('Compiler fallback','err')}}
async function run(){const source=code.value; if(!source.trim()){setStatus('Kode kosong','err');return} $('run').disabled=true; setStatus('Menjalankan...'); output.textContent=''; $('time').textContent=''; const started=performance.now(); try{const payload={source,lang:'c++',allowStoreCodeDebug:false,options:{userArguments:$('flags').value,executeParameters:{args:[],stdin:$('stdin').value},compilerOptions:{executorRequest:true},filters:{execute:true},tools:[],libraries:[]}}; const r=await fetch('https://godbolt.org/api/compiler/'+encodeURIComponent(compiler.value)+'/compile',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)}); const data=await r.json(); let text=''; if(data.stderr)text+='[stderr]\n'+data.stderr+'\n'; if(data.stdout)text+='[stdout]\n'+data.stdout+'\n'; if(data.asm&&Array.isArray(data.asm))text+='[compiler]\n'+data.asm.map(x=>x.text||'').join('\n'); if(data.code)text+='\n[compiler code] '+data.code; if(!text.trim())text=JSON.stringify(data,null,2); output.textContent=text; const failed=!!(data.stderr||data.code); setStatus(failed?'Selesai dengan error':'Selesai',failed?'err':'ok'); $('time').textContent=Math.round(performance.now()-started)+' ms'}catch(e){output.textContent='Gagal menjalankan:\n'+e.message+'\n\nJika API sedang penuh, coba lagi beberapa detik kemudian.';setStatus('Gagal','err')}finally{$('run').disabled=false}}
$('run').onclick=run;$('sample').onclick=()=>{code.value='#include <iostream>\nusing namespace std;\n\nint main() {\n    int a, b;\n    cin >> a >> b;\n    cout << "Hasil: " << a + b << "\\n";\n    return 0;\n}';$('stdin').value='10 25';setStatus('Contoh dimuat')};$('clear').onclick=()=>{code.value='';output.textContent='Output akan muncul di sini.';setStatus('Dibersihkan')};code.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const s=code.selectionStart;code.value=code.value.slice(0,s)+'    '+code.value.slice(code.selectionEnd);code.selectionStart=code.selectionEnd=s+4}});loadCompilers();
</script>
</body></html>
